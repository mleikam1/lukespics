<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Luke’s Picks is a private weekly sports pick’em arena—no odds, no wagers, just bragging rights.">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Luke’s Picks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Luke’s Picks</title>
  <script>
    // Flutter's web bootstrap can normalize the platform route before Dart
    // starts, which drops a fragment-based private invite. Capture the exact
    // same-origin route first so the app can hand it to GoRouter after auth
    // and Firebase initialization finish.
    window.__lukesPicksInitialLocation =
      window.location.pathname + window.location.search + window.location.hash;

    // Keep durable Firebase Auth state on one user-facing origin. Firebase's
    // alternate Hosting hostname remains available for the OAuth handler, but
    // top-level visits should always return to the canonical live app.
    if (window.location.hostname === 'lukes-picks.firebaseapp.com') {
      window.location.replace(
        'https://lukes-picks.web.app' +
        window.location.pathname +
        window.location.search +
        window.location.hash
      );
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #0B1F3A; }
    #boot {
      align-items: center; color: #F7F9FC; display: flex; flex-direction: column;
      font: 800 16px system-ui, -apple-system, sans-serif; gap: 16px;
      inset: 0; justify-content: center; letter-spacing: .08em; position: fixed;
    }
    #boot img { height: 76px; width: 76px; }
    @media (prefers-reduced-motion: no-preference) {
      #boot img { animation: pulse 1.4s ease-in-out infinite alternate; }
      @keyframes pulse { to { transform: scale(1.04); opacity: .82; } }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="favicon.svg" alt="">
    <span>SETTING THE ARENA…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('boot')?.remove();
      document.body.style.background = '';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
