name: CI

on:
  pull_request:
  push:
    branches:
      - codex/lukes-picks-mvp
      - codex/connected-picker-flow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze, test, and web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - name: Validate release-safety scripts
        run: |
          bash -n scripts/*.sh
          ./scripts/check_public_source.sh
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Scan fresh public build
        run: ./scripts/check_public_build.sh build/web

  functions:
    name: Functions and Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
        working-directory: functions
      - name: Audit complete dependency graph
        run: npm audit --audit-level=critical
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm run typecheck
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm run test:rules
        working-directory: functions
      - name: Seed disabled emulator-only provider configuration
        run: |
          printf '%s\n' \
            'ALLOW_API_SPORTS_PROVIDER=false' \
            'ALLOW_SPORTSDATAIO_PROVIDER=false' \
            'SPORTSDATAIO_ACCESS_MODE=fixture' \
            'SPORTSDATAIO_ENTITLEMENT_VERIFIED=false' \
            > .env.local
          printf '%s\n' \
            'INVITE_CODE_PEPPER=ci-only-emulator-pepper' \
            'SPORTSDATAIO_API_KEY=" "' \
            > .secret.local
        working-directory: functions
      - run: npm run test:integration
        working-directory: functions
      - run: npm run build
        working-directory: functions
